<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    
<div class="container">

    <div class="header">

        <div class="search-box">

            <input type="text" placeholder="Enter Your Location" class="input-box">

                <button class="fa-solid fa-magnifying-glass" id="searchBtn"></button>

        </div>
    </div>




    <div class="location-not-found">
        <h1>Sorry,location not found!!</h1>
        <img src="https://github.com/CodeTraversal/JavaScript-Projects/blob/main/Weather%20App/assets/404.png?raw=true" alt="404 error">
    </div>




      <div class="weather-body">
       <img src="https://i.pinimg.com/736x/e0/fe/64/e0fe6486523d09fc1303e8dc79a88727.jpg"
        alt="weather-image" class="weather-img">

        <div class="weather-box">
              <p class="temperature">0 <sup>°C</sup>  </p>
              <p class="description">Light rain</p>
        </div>
     
        <div class="weather-details">
            <div class="humidity">
                <i class="fa-solid fa-droplet"></i>
                <div class="text">
                    <span id="humidity">45%</span>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="wind-speed">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span id="wind-speed">12km/H</span>
                    <p>Wind-speed</p>
                </div>
            </div>

        </div>

    </div> 

      
</div>



</body>

<script src="first.js"></script>

</html>
